name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ./data/pmtool.db
      APP_SECRET: ci-secret-at-least-32-bytes-long-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pm/core build
      - run: pnpm -r --filter './packages/*' build
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm -r --filter './packages/*' test
