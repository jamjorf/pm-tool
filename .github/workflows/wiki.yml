name: Sync wiki
# Publishes the wiki/ directory to this repository's GitHub Wiki on every push
# to main that touches it. The wiki must be enabled (Settings → Features →
# Wikis) and have at least one page created in the web UI before the first
# sync can push; until then this job logs what to do and succeeds.
on:
  push:
    branches: [main]
    paths: ["wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone the wiki repository
        id: clone
        continue-on-error: true
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" /tmp/wiki
      - name: Explain how to initialise the wiki
        if: steps.clone.outcome == 'failure'
        run: |
          echo "::warning::The GitHub Wiki for ${{ github.repository }} is not initialised yet."
          echo "Enable it under Settings → Features → Wikis, create any first page in the web UI,"
          echo "then re-run this workflow (Actions → Sync wiki → Run workflow)."
      - name: Copy pages and push
        if: steps.clone.outcome == 'success'
        run: |
          rsync -a --delete --exclude .git wiki/ /tmp/wiki/
          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki already up to date"; exit 0; fi
          git commit -m "Sync wiki from ${{ github.sha }}"
          git push
